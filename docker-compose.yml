version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Nginx がリスン
      - "5000:5000"  # Flask がリスン
    volumes:
      - .:/app
    environment:
      FLASK_ENV: "production"
      FLASK_DEBUG: "False"
      SECRET_KEY: "mysecretkey"
      PORT: "5000"  # Flask を 5000 で起動
    restart: unless-stopped
