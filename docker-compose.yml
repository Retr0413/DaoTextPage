services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_USER: root
      DB_PASSWORD: password
      DB_HOST: db
      DB_NAME: flaskdb
    depends_on:
      - db
    volumes:
      - .:/app
    command: >
      ./wait-for-it.sh db:3306 -- gunicorn -w 2 -b 0.0.0.0:8080 run:app

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: flaskdb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
