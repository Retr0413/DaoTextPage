# docker-compose.dev.yml の例
version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: flaskdb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app 
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      DB_USER: root
      DB_PASSWORD: password
      DB_HOST: db
      DB_NAME: flaskdb
    depends_on:
      - db

volumes:
  db_data:
