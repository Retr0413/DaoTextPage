version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000"  
    volumes:
      - .:/app
    environment:
      FLASK_ENV: "production"
      FLASK_DEBUG: "False"
      SECRET_KEY: "mysecretkey"
      FLASK_PORT: "5000"  
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app  
    restart: unless-stopped
