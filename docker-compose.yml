version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Cloud Run でも利用できるようにポート 8080 を明示
    volumes:
      - .:/app
    environment:
      FLASK_ENV: "production"
      FLASK_DEBUG: "False"
      SECRET_KEY: "mysecretkey"
      PORT: "8080"  # Cloud Run では 8080 を指定するのが推奨
    restart: unless-stopped
