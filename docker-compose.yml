version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: flaskdb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:  # ヘルスチェックを追加
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped  # 再起動ポリシー

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      DB_USER: root
      DB_PASSWORD: password
      DB_HOST: db
      DB_NAME: flaskdb
    depends_on:
      db:  # dbサービスに依存
        condition: service_healthy  # dbがヘルシー状態になるまで待機
    restart: unless-stopped  # 再起動ポリシー

volumes:
  db_data:
