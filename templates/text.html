<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ text.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        header {
            background-color: #000;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header .logo {
            display: flex;
            align-items: center;
            margin-right: 30px;
        }

        .triangle-logo {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }

        .header .nav {
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .nav-item {
            color: #fff;
            cursor: pointer;
            position: relative;
            font-size: 16px;
            text-align: left;
        }

        .nav-item:hover {
            color: #FFD700;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #000;
            color: #fff;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            min-width: 150px;
        }

        .nav-item:hover .dropdown-menu {
            display: flex;
        }

        .dropdown-menu a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            white-space: nowrap;
        }

        .dropdown-menu a:hover {
            background-color: #FFD700;
            color: #000;
        }

        footer {
            background-color: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
        }

        .footer-nav a {
            color: #fff;
            text-decoration: none;
        }

        .footer-nav a:hover {
            color: #FFD700;
        }

        .pdf-container {
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="{{ url_for('main.index') }}">
                <img src="{{ url_for('static', filename='uploads/だおだおロゴ.png') }}" alt="だおだおテキスト" class="triangle-logo">
            </a>
        </div>
        <div class="nav">
            <div class="nav-item" onclick="toggleDropdown(this)">機構の説明
                <div class="dropdown-menu">
                    <a href="{{ url_for('main.mechanism') }}">ロボット基礎知識</a>
                    <a href="{{ url_for('main.gears') }}">ギアの種類</a>
                    <a href="{{ url_for('main.movement') }}">移動方式</a>
                    <a href="{{ url_for('main.basic_mechanisms') }}">基本機構</a>
                    <a href="{{ url_for('main.sensors') }}">センサー</a>
                    <a href="{{ url_for('main.special_mechanisms') }}">特殊機構</a>
                </div>
            </div>
            <div class="nav-item" onclick="toggleDropdown(this)">リンク
                <div class="dropdown-menu">
                    <a href="https://akiyuki.jp/">外部リンク1</a>
                </div>
            </div>
            <div class="nav-item" onclick="toggleDropdown(this)">作成依頼リンク
                <div class="dropdown-menu">
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdLXEhs-E4C8cFYCvby7iktfm9dJuClfRFH-XbwikIdS_pWBg/viewform">Googleフォーム</a>
                    <a href="#">その他のリンク</a>
                </div>
            </div>
            <div class="nav-item" onclick="toggleDropdown(this)">ログイン
                <div class="dropdown-menu">
                    <a href="{{ url_for('auth.login') }}">ログイン</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container-fluid" style="padding: 20px;">
        <h2 class="text-center">{{ text.title }}</h2>
        <p class="text-center">{{ text.context }}</p>

        <h4 class="text-center">テキスト内容:</h4>
        <iframe
            class="pdf-container"
            src="{{ url_for('static', filename=text.pdf_path) }}"
            frameborder="0">
        </iframe>
    </main>

    <footer>
        <nav class="footer-nav">
            <a href="#">サイトマップ</a>
            <a href="#">SNS</a>
            <a href="#">トップ</a>
            <a href="#">リンク</a>
            <a href="#">だおだおテキスト</a>
        </nav>
    </footer>
</body>
</html>
