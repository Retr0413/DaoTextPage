<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ text.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        header {
            background-color: #343a40;
            color: #fff;
            padding: 15px;
        }


        .pdf-container {
            width: 100vw;  
            height: 100vh; 
            border: none;  
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="btn btn-light">TOPへ</a>
        </div>
    </header>

    <main class="container-fluid" style="padding: 0;">
        <h2 class="text-center">{{ text.title }}</h2>
        <p class="text-center">{{ text.context }}</p>

        <h4 class="text-center">PDFファイルを表示:</h4>
        <iframe
            class="pdf-container"
            src="{{ url_for('static', filename=text.pdf_path) }}"
            frameborder="0">
        </iframe>
    </main>
</body>
</html>
