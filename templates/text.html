<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ text.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .pdf-container {
            width: 100%;
            height: 800px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header class="bg-dark text-white py-3">
        <div class="container">
            <a href="/" class="btn btn-light">TOPへ</a>
        </div>
    </header>

    <main class="container my-5">
        <h2>{{ text.title }}</h2>
        <p>{{ text.context }}</p>

        <h4>PDFファイルを表示:</h4>
        <iframe
            class="pdf-container"
            src="{{ url_for('static', filename=text.pdf_path) }}"
            frameborder="0">
        </iframe>
    </main>
</body>
</html>
