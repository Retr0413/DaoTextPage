<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ text.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        header {
            background-color: #000;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header .logo {
            display: flex;
            align-items: center;
            margin-right: 30px;
        }

        .triangle-logo {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }

        .header .nav {
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .nav-item {
            color: #fff;
            cursor: pointer;
            position: relative;
            font-size: 16px;
            text-align: left;
        }

        .nav-item:hover {
            color: #FFD700;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #000;
            color: #fff;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            min-width: 150px;
        }

        .nav-item:hover .dropdown-menu {
            display: flex;
        }

        .dropdown-menu a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            white-space: nowrap;
        }

        .dropdown-menu a:hover {
            background-color: #FFD700;
            color: #000;
        }

        .nav-icon {
            width: 30px; 
            height: 30px; 
            object-fit: contain; 
            -webkit-filter: brightness(0) invert(1);
            filter: brightness(0) invert(1);
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            font-size: 20px;
            font-weight: bold;
        }

        .section-title::before,
        .section-title::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
            margin: 0 20px;
        }

        .mechanism-tag {
            display: inline-block;
            margin: 5px;
            padding: 8px 12px;
            background-color: #f5f5f5;
            color: #333;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        footer {
            background-color: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
        }

        .footer-nav a {
            color: #fff;
            text-decoration: none;
        }

        .footer-nav a:hover {
            color: #FFD700;
        }

        .pdf-container {
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="{{ url_for('main.index') }}">
                <img src="{{ url_for('static', filename='uploads/だおだおロゴ.png') }}" alt="だおだおテキスト" class="triangle-logo">
            </a>
        </div>
        <div class="nav">
            <div class="nav-item">
                <img src="{{ url_for('static', filename='uploads/歯車.png') }}" alt="説明" class="nav-icon">
                機構の説明
            </div>
            <div class="nav-item">
                <img src="{{ url_for('static', filename='uploads/リンク.png') }}" alt="リンク" class="nav-icon">
                リンク
            </div>
            <div class="nav-item">
                <img src="{{ url_for('static', filename='uploads/作成依頼リンク.png') }}" alt="依頼" class="nav-icon">
                作成依頼リンク
            </div>
            <div class="nav-item">
                <img src="{{ url_for('static', filename='uploads/ログイン.png') }}" alt="ログイン" class="nav-icon">
                ログイン
            </div>
        </div>
    </header>

    <main class="container-fluid" style="padding: 20px;">
        <h2 class="text-center">{{ text.title }}</h2>
        <p class="text-center">{{ text.context }}</p>
        
        <div class="section-title">使用している機構</div>
        <div class="text-center">
            {% for mechanism in text.mechanism.split(",") %}
                <span class="mechanism-tag">{{ mechanism.strip() }}</span>
            {% endfor %}
        </div>

        <div class="section-title">テキスト内容</div>
        <iframe
            class="pdf-container"
            src="{{ url_for('static', filename=text.pdf_path) }}"
            frameborder="0">
        </iframe>
    </main>

    <footer>
        <nav class="footer-nav">
            <a href="#">サイトマップ</a>
            <a href="#">SNS</a>
            <a href="#">トップ</a>
            <a href="#">リンク</a>
            <a href="#">だおだおテキスト</a>
        </nav>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
        // ドロップダウンメニューの表示制御
        function toggleDropdown(element) {
            const dropdownMenu = element.querySelector('.dropdown-menu');
            if (dropdownMenu) {
                dropdownMenu.style.display = dropdownMenu.style.display === 'flex' ? 'none' : 'flex';
            }
        }

        // タブの初期化
        document.addEventListener('DOMContentLoaded', function() {
            var triggerTabList = [].slice.call(document.querySelectorAll('#mechanismTabs button'));
            triggerTabList.forEach(function(triggerEl) {
                var tabTrigger = new bootstrap.Tab(triggerEl);
                triggerEl.addEventListener('click', function(event) {
                    event.preventDefault();
                    tabTrigger.show();
                });
            });
        });
    </script>
</body>
</html>
