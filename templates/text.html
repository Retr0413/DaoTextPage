<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ text.title }}</title>
    <!-- Bootstrap読み込み -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/textstyle.css') }}">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="{{ url_for('main.index') }}">
                <img src="{{ url_for('static', filename='uploads/だおだおロゴ.png') }}" alt="だおだおテキスト" class="triangle-logo">
            </a>
        </div>
        <div class="nav">
            <div class="nav-item" onclick="toggleDropdown(this)">
                <img src="{{ url_for('static', filename='uploads/歯車.png') }}" alt="説明" class="nav-icon">
                機構の説明
                <div class="dropdown-menu">
                    <a href="{{ url_for('main.mechanism') }}">ロボット基礎知識</a>
                    <a href="{{ url_for('main.gears') }}">ギアの種類</a>
                    <a href="{{ url_for('main.movement') }}">移動方式</a>
                    <a href="{{ url_for('main.basic_mechanisms') }}">基本機構</a>
                    <a href="{{ url_for('main.sensors') }}">センサー</a>
                    <a href="{{ url_for('main.special_mechanisms') }}">特殊機構</a>
                </div>
            </div>
            <div class="nav-item" onclick="toggleDropdown(this)">
                <img src="{{ url_for('static', filename='uploads/リンク.png') }}" alt="リンク" class="nav-icon">
                リンク
                <div class="dropdown-menu">
                    <a href="">だおだお作成作品</a>
                    <a href="https://www.lego.com/ja-jp">LEGO公式サイト</a>
                    <a href="https://akiyuki.jp/">外部リンク1</a>
                </div>
            </div>
            <div class="nav-item" onclick="toggleDropdown(this)">
                <img src="{{ url_for('static', filename='uploads/作成依頼リンク.png') }}" alt="依頼" class="nav-icon">
                作成依頼リンク
                <div class="dropdown-menu">
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdLXEhs-E4C8cFYCvby7iktfm9dJuClfRFH-XbwikIdS_pWBg/viewform">Googleフォーム</a>
                    <a href="#">その他のリンク</a>
                </div>
            </div>
            <div class="nav-item" onclick="toggleDropdown(this)">
                <img src="{{ url_for('static', filename='uploads/ログイン.png') }}" alt="ログイン" class="nav-icon">
                ログイン
                <div class="dropdown-menu">
                    <a href="{{ url_for('auth.login') }}">ログイン</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container-fluid" style="padding: 20px;">
        <h2 class="text-center">{{ text.title }}</h2>
        <p class="text-center">{{ text.context }}</p>
        
        <div class="section-title">使用している機構</div>
        <div class="text-center">
            {% for mechanism in text.mechanism.split(",") %}
                <span class="mechanism-tag">{{ mechanism.strip() }}</span>
            {% endfor %}
        </div>

        <div class="section-title">テキスト内容</div>
        <iframe
            class="pdf-container"
            src="{{ url_for('static', filename=text.pdf_path) }}"
            frameborder="0">
        </iframe>
    </main>

    <footer>
        <nav class="footer-nav">
            <a href="#">サイトマップ</a>
            <a href="#">SNS</a>
            <a href="#">トップ</a>
            <a href="#">リンク</a>
            <a href="#">だおだおテキスト</a>
        </nav>
    </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='javascript/textscript.js') }}"></script>
</body>
</html>
