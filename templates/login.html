<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>だおだおテキスト ログイン</title>
    <style>
        body { background-color: #727272; font-family: 'Comic Sans MS', cursive, sans-serif; color: #000000; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .triangle-logo { width: 60px; height: 50px; margin-right: 0px; object-fit: contain; }
        .login-container { background-color: #ffffff; padding: 40px; border-radius: 20px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); text-align: center; }
        .character { width: 150px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        input { width: 90%; padding: 10px 15px; border: 2px solid #000000; border-radius: 25px; font-size: 16px }
        input::placeholder { color: #000000; }
        input:focus { outline: none; border-color: #000000; box-shadow: 0 0 5px rgba(255, 192, 203, 0.5); }
        button { width: 100%; padding: 10px; background-color: #000000; border: none; border-radius: 25px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s ease; }
        button:hover { background-color: #000000; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1><img src="{{ url_for('static', filename='uploads/だおだおロゴ.png') }}" alt="だおだおテキスト" class="triangle-logo">ログイン</h1>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="username">ユーザー名</label>
                <input type="text" id="username" name="username" placeholder="ユーザー名を入力" required>
            </div>
            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" placeholder="パスワードを入力" required>
            </div>
            <button type="submit">ログイン</button>
        </form>
    </div>
</body>
</html>
