<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <title>だおだおテキスト ログイン</title>
    <style>
       /* 全体のはみ出し防止 */
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden; /* 水平方向のスクロールを出さない */
      box-sizing: border-box;
    }

    /* ================================
     * ヘッダー（上部メニュー）
     * ================================ */
    header {
      background-color: #000;
      color: #fff;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      width: 100%;
    }
    .header {
      background: #000;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 20px;
      width: 100%;
      box-sizing: border-box;
      overflow: hidden; /* 念のため */
    }

    /* ロゴ */
    .header .logo {
      display: flex;
      align-items: center;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0; /* ロゴは縮まない */
    }
    .triangle-logo {
      width: 40px;
      height: 40px;
      margin-right: 10px;
      margin-top: 10px;
      object-fit: contain;
    }

    /* ヘッダー右側のメニュー */
    .header .nav {
      display: flex;
      flex-wrap: nowrap; 
      gap: 50px;
      flex-shrink: 1; /* 狭い画面でナビを縮める */
      min-width: 0;   /* はみ出し防止に重要 */
    }
    .header .nav-item {
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      padding: 10px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      min-width: 0;
      flex-shrink: 1;
    }
    .nav-icon {
      width: 30px; 
      height: 30px; 
      object-fit: contain; 
      -webkit-filter: brightness(0) invert(1);
      filter: brightness(0) invert(1);
      flex-shrink: 0; /* アイコンは縮まない */
    }
    .header .nav-item:hover {
      color: #FFD700;
    }

    /* ドロップダウンメニューCSS */
    .dropdown-menu {
        position: absolute;
        top: 100%;
        left: 0;
        background: #000;
        color: #fff;
        display: none;
        flex-direction: column;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        min-width: 150px;
        z-index: 9999; /* 前面に表示するために追加 */
    }
    .dropdown-menu a { color: #fff; text-decoration: none; padding: 10px 20px; white-space: nowrap; }
    .dropdown-menu a:hover { background: #FFD700; color: #000; }
    .nav-item.active .fropdown-menu,
    .nav-item:hover .dropdown-menu { display: flex; }

        .main-content {
            flex: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .login-container h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input {
            width: 90%;
            padding: 10px 15px;
            border: 2px solid #000000;
            border-radius: 25px;
            font-size: 16px;
        }

        input::placeholder {
            color: #000000;
        }

        input:focus {
            outline: none;
            border-color: #000000;
            box-shadow: 0 0 5px rgba(255, 192, 203, 0.5);
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #000000;
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #333333;
        }

        footer {
      background-color: #000;
      color: #fff;
      padding: 20px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
    .footer-nav {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 50px;
      font-size: 14px;
      list-style: none;
      margin: 0;
      padding: 0;
      flex-shrink: 1;
      min-width: 0;
      white-space: nowrap;
    }
    .footer-nav a {
      color: #fff;
      text-decoration: none;
      white-space: nowrap; 
    }
    .footer-nav a:hover {
      color: #FFD700;
    }

    /* ================================
     * タブレット (iPadなど) 向け
     * ================================ */
     @media (min-width: 768px) and (max-width: 1024px) {
      .header .nav-item {
        font-size: 16px;
        padding: 8px;
      }
      #mechanismTabs {
        gap: 15px;
      }
      #mechanismTabs .nav-link {
        padding: 8px 12px;
        font-size: 16px;
      }
      .footer-nav {
        gap: 30px;
      }
    }

    /* ================================
     * スマホ画面向け（小さくする）
     * ================================ */
     @media (max-width: 768px) {
      .triangle-logo {
        width: 30px;
        height: 30px;
        margin-right: 5px;
        margin-top: 5px;
      }
      .header, header {
        padding: 10px;
      }
      .header .nav {
        gap: 10px;
      }
      .header .nav-item {
        padding: 3px;
        font-size: 12px;
        gap: 3px;
      }
      .nav-icon {
        width: 20px; 
        height: 20px;
      }
      #mechanismTabs {
        gap: 10px;
      }
      #mechanismTabs .nav-link {
        padding: 5px 10px;
        font-size: 14px;
      }
      .footer-nav {
        gap: 20px;
        font-size: 12px;
      }
    }

    @media (max-width: 576px) {
      .header .nav-item {
        font-size: 10px;
      }
      .nav-icon {
        width: 16px;
        height: 16px;
      }
      .header .nav {
        gap: 5px;
      }
      #mechanismTabs {
        gap: 5px;
      }
      #mechanismTabs .nav-link {
        font-size: 12px;
        padding: 4px 8px;
      }
      .footer-nav {
        gap: 15px;
        font-size: 10px;
      }
    }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="{{ url_for('main.index') }}">
                <img src="{{ url_for('static', filename='uploads/だおだおロゴ.png') }}" alt="だおだおテキスト" class="triangle-logo">
            </a>
        </div>
        <div class="nav">
            <div class="nav-item" onclick="toggleDropdown(this)">
                <img src="{{ url_for('static', filename='uploads/歯車.png') }}" alt="説明" class="nav-icon">
                機構の説明
                <div class="dropdown-menu">
                    <a href="{{ url_for('main.mechanism') }}">ロボット基礎知識</a>
                    <a href="{{ url_for('main.gears') }}">ギアの種類</a>
                    <a href="{{ url_for('main.movement') }}">移動方式</a>
                    <a href="{{ url_for('main.basic_mechanisms') }}">基本機構</a>
                    <a href="{{ url_for('main.sensors') }}">センサー</a>
                    <a href="{{ url_for('main.special_mechanisms') }}">特殊機構</a>
                </div>
            </div>
            <div class="nav-item" onclick="toggleDropdown(this)">
                <img src="{{ url_for('static', filename='uploads/リンク.png') }}" alt="リンク" class="nav-icon">
                リンク
                <div class="dropdown-menu">
                    <a href="">だおだお作成作品</a>
                    <a href="https://www.lego.com/ja-jp">LEGO公式サイト</a>
                    <a href="https://akiyuki.jp/">外部リンク1</a>
                </div>
            </div>
            <div class="nav-item" onclick="toggleDropdown(this)">
                <img src="{{ url_for('static', filename='uploads/作成依頼リンク.png') }}" alt="依頼" class="nav-icon">
                作成依頼リンク
                <div class="dropdown-menu">
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdLXEhs-E4C8cFYCvby7iktfm9dJuClfRFH-XbwikIdS_pWBg/viewform">Googleフォーム</a>
                    <a href="#">その他のリンク</a>
                </div>
            </div>
            <div class="nav-item" onclick="toggleDropdown(this)">
                <img src="{{ url_for('static', filename='uploads/ログイン.png') }}" alt="ログイン" class="nav-icon">
                ログイン
                <div class="dropdown-menu">
                    <a href="{{ url_for('auth.login') }}">ログイン</a>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <div class="main-content">
        <div class="login-container">
            <h1><img src="{{ url_for('static', filename='uploads/だおだおロゴ.png') }}" alt="だおだおテキスト" class="triangle-logo">ログイン</h1>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label for="username">ユーザー名</label>
                    <input type="text" id="username" name="username" placeholder="ユーザー名を入力" required>
                </div>
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" name="password" placeholder="パスワードを入力" required>
                </div>
                <button type="submit">ログイン</button>
            </form>
        </div>
    </div>

    <footer>
        <nav class="footer-nav">
            <a href="#">サイトマップ</a>
            <a href="#">SNS</a>
            <a href="#">トップ</a>
            <a href="#">リンク</a>
            <a href="#">だおだおテキスト</a>
        </nav>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
      // ドロップダウンメニュー：クリックで表示/非表示を切り替え
      function toggleDropdown(element) {
        // ほかのnav-itemを一旦閉じる
        document.querySelectorAll('.nav-item').forEach(item => {
          item.classList.remove('active');
        });

        // クリックしたnav-itemがアクティブでなければ付与
        if (!element.classList.contains('active')) {
          element.classList.add('active');
        }
      }

      // タブの初期化
      document.addEventListener('DOMContentLoaded', function() {
        var triggerTabList = [].slice.call(
          document.querySelectorAll('#mechanismTabs button')
        );
        triggerTabList.forEach(function(triggerEl) {
          var tabTrigger = new bootstrap.Tab(triggerEl);
          triggerEl.addEventListener('click', function(event) {
            event.preventDefault();
            tabTrigger.show();
          });
        });
      });

      // メニュー以外をクリックしたらドロップダウンを閉じる
      document.addEventListener('click', function(event) {
        if (!event.target.closest('.nav-item')) {
          // メニュー以外をクリックしたら全てのnav-itemをinactiveに
          document.querySelectorAll('.nav-item').forEach(item => {
            item.classList.remove('active');
          });
        }
      });
    </script>
</body>
</html>
