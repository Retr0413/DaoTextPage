<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Public Post</title>
</head>
<body>
    <h1>作品投稿ページ</h1>
    <form method="POST" enctype="multipart/form-data">
        <label for="creator_name">作成者名:</label>
        <input type="text" name="creator_name" id="creator_name" required>
        <br>
        <label for="image_file">画像ファイル:</label>
        <input type="file" name="image_file" id="image_file" accept=".png, .jpg, .jpeg" required>
        <br>
        <button type="submit">投稿</button>
    </form>
</body>
</html>
