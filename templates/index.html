<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>だおだおテキスト</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #fff;
        }

        .header {
            background: #000;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .header .nav {
            font-size: 14px;
        }

        .main-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .title-plate {
            background: #000;
            color: #fff;
            padding: 10px 20px;
            margin: 20px 0;
            display: inline-block;
            border-radius: 5px;
        }

        .description {
            margin: 20px 0;
            font-size: 16px;
            line-height: 1.5;
        }

        .usage-note {
            background: #f9f9f9;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            font-size: 14px;
            color: #555;
            border-left: 5px solid #000;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 20px 0;
        }

        .grid-item {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }

        .grid-item:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .grid-item img {
            width: 100%;
            max-width: 150px;
            border-radius: 5px;
        }

        .pink-section .grid-item {
            background: #ffe3e6;
        }

        .yellow-section .grid-item {
            background: #fff4d6;
        }

        .stars {
            color: #FFD700;
            font-size: 14px;
            margin: 5px 0;
        }

        .footer {
            background: #000;
            color: #fff;
            padding: 20px;
            margin-top: 40px;
            text-align: center;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
        }

        .footer-nav a {
            color: #fff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-nav a:hover {
            color: #FFD700;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">▲ だおだお</div>
        <div class="nav">New ▼ | リンク | トピック</div>
    </header>

    <main class="main-content">
        <h1 class="title-plate">だおだおテキスト</h1>

        <div class="description">
            <p>だおだおテキストの一覧</p>
        </div>

        <div class="grid-container">
            {% for text in texts %}
            <div class="grid-item">
                <h2>{{ text.title }}</h2>
                <a href="{{ url_for('main.text_detail', id=text.id) }}">詳細を見る</a>
            </div>
            {% endfor %}
        </div>
    </main>

    <footer class="footer">
        <nav class="footer-nav">
            <a href="#">サイトマップ</a>
            <a href="#">SNS</a>
            <a href="#">トップ</a>
            <a href="#">リンク</a>
            <a href="#">だおだおテキスト</a>
        </nav>
    </footer>
</body>
</html>
