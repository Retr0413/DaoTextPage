<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>だおだおテキスト</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #fff; }
        .header { background: #000; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); }
        .header .logo { font-size: 24px; font-weight: bold; }
        .header .nav { font-size: 14px; }
        .main-content { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .title-plate { background: #000; color: #fff; padding: 10px 20px; margin: 20px 0; display: inline-block; border-radius: 5px; font-size: 24px; font-weight: bold; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
        .grid-item { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 15px; text-align: center; transition: transform 0.2s; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); }
        .grid-item:hover { transform: scale(1.05); }
        .grid-item img { width: 100%; max-width: 150px; margin-bottom: 10px; }
        .pink-section .grid-item { background: #ffe3e6; }
        .yellow-section .grid-item { background: #fff4d6; }
        .stars { color: #FFD700; font-size: 18px; font-weight: bold; margin: 10px 0; }
        .footer { background: #000; color: #fff; padding: 20px; text-align: center; margin-top: 40px; }
        .footer-nav { display: flex; justify-content: center; gap: 20px; font-size: 14px; }
        .footer-nav a { color: #fff; text-decoration: none; }
        .footer-nav a:hover { color: #FFD700; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">▲ だおだお</div>
        <div class="nav">New ▼ | リンク | トピック</div>
    </header>

    <main class="main-content">
        <h1 class="title-plate">だおだおテキスト</h1>

        {% for star, texts in texts_by_star.items() %}
        <section>
            <h2>★{{ star }}</h2>
            <div class="grid-container">
                {% for text in texts %}
                <div class="grid-item">
                    <img src="{{ url_for('static', filename=text.text_png) }}" alt="{{ text.title }}">
                    <h3>{{ text.title }}</h3>
                    <p>{{ text.context }}</p>
                    <a href="{{ url_for('main.text_detail', id=text.id) }}">詳細を見る</a>
                </div>
                {% endfor %}
            </div>
        </section>
        {% endfor %}
    </main>

    <footer class="footer">
        <nav class="footer-nav">
            <a href="#">サイトマップ</a>
            <a href="#">SNS</a>
            <a href="#">トップ</a>
            <a href="#">リンク</a>
            <a href="#">だおだおテキスト</a>
        </nav>
    </footer>
</body>
</html>
