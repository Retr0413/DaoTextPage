<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロボット機構の基礎知識</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        header {
            background-color: #000;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header { background: #000; color: #fff; padding: 10px 20px; display: flex; justify-content: flex-start; align-items: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); gap: 20px; }
        .header .logo { display: flex; align-items: center; font-size: 26px; font-weight: bold; cursor: pointer; }
        .triangle-logo { width: 40px; height: 40px; margin-right: 10px; margin-top: 10px; object-fit: contain; }
        .header .nav { position: relative; display: flex; gap: 30px; }
        .header .nav-item { color: #fff; font-size: 18px; cursor: pointer; padding: 10px; position: relative; }
        .header .nav-item:hover { color: #FFD700; }
        .mechanism-card {
            transition: transform 0.2s;
        }
        .mechanism-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .nav-pills .nav-link.active {
            background-color: #0d6efd;
        }
        .category-content {
            display: none;
        }
        .category-content.active {
            display: block;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .col {
            flex: 0 0 calc(50% - 10px);
            box-sizing: border-box;
        }

        footer {
            background-color: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
        }

        .footer-nav a {
            color: #fff;
            text-decoration: none;
        }

        .footer-nav a:hover {
            color: #FFD700;
        }

        /* ドロップダウンメニューCSS */
        .dropdown-menu { position: absolute; top: 100%; left: 0; background: #000; color: #fff; display: none; flex-direction: column; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); min-width: 150px; z-index: 1000; }
        .dropdown-menu a { color: #fff; text-decoration: none; padding: 10px 20px; white-space: nowrap; }
        .dropdown-menu a:hover { background: #FFD700; color: #000; }
        .nav-item.active .fropdown-menu,
        .nav-item:hover .dropdown-menu { display: flex; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="{{ url_for('main.index') }}">
                <img src="{{ url_for('static', filename='uploads/だおだおロゴ.png') }}" alt="だおだおテキスト" class="triangle-logo">
            </a>
        </div>
        <div class="nav">
            <div class="nav-item" onclick="toggleDropdown(this)">機構の説明
                <div class="dropdown-menu">
                    <a href="{{ url_for('main.mechanism') }}">ギアの説明</a>
                    <a href="#">リンク機構</a>
                    <a href="#">センサーの種類</a>
                </div>
            </div>
            <div class="nav-item" onclick="toggleDropdown(this)">リンク
                <div class="dropdown-menu">
                    <a href="#">外部リンク1</a>
                    <a href="#">外部リンク2</a>
                </div>
            </div>
            <div class="nav-item" onclick="toggleDropdown(this)">作成依頼リンク
                <div class="dropdown-menu">
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdLXEhs-E4C8cFYCvby7iktfm9dJuClfRFH-XbwikIdS_pWBg/viewform">Googleフォーム</a>
                    <a href="#">その他のリンク</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-5">
        <h1 class="text-center">センサー</h1>
\
        <ul class="nav nav-pills mb-4 justify-content-center" id="mechanismTabs">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="pill" href="#gears">ギアの種類</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="pill" href="#movement">移動方式</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="pill" href="#mechanisms">基本機構</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="pill" href="#sensors">センサー</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="pill" href="#special">特殊機構</a>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade" >
                <div class="row row-cols-1 row-cols-md-2 g-4">
                    <div class="col-md-12">
                        <div class="card h-100 mechanism-card">
                            <div class="card-body">
                                <h5 class="card-title">カラーセンサー</h5>
                                <p class="card-text">物体の色を検知するセンサー。ライントレースや物体の識別に使用されます。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <nav class="footer-nav">
            <a href="#">サイトマップ</a>
            <a href="#">SNS</a>
            <a href="#">トップ</a>
            <a href="#">リンク</a>
            <a href="#">だおだおテキスト</a>
        </nav>
    </footer>
</body>
</html>
